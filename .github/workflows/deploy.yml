# 公開サイトのビルドとデプロイ（Cloudflare Pages の Direct Upload）
# main への push と管理画面・定期処理からの起動（workflow_dispatch）は本番、develop への push はプレビュー
name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 起動の理由（ログ用）
        type: string
        required: false
        default: manual

permissions:
  contents: read

# 同じブランチの実行中のジョブは取り消し、最後の1回だけを最後まで走らせる
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-pages
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: 起動の理由を記録
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          printf 'event: %s / reason: %s\n' "$EVENT" "${REASON:0:40}" >> "$GITHUB_STEP_SUMMARY"
      - name: 続けて来る起動をまとめるため60秒待つ
        if: github.event_name == 'workflow_dispatch'
        run: sleep 60
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 公開用ビューを読む
        run: pnpm fetch-data
      - name: 写真のキャッシュを戻す
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/photos
          key: photos-v1-${{ hashFiles('.data/photo-ids.txt') }}
          restore-keys: photos-v1-
      - name: 写真を取り込む
        run: pnpm fetch-photos
      - name: 写真のキャッシュを保存する
        if: steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/photos
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: ビルド
        run: pnpm build
      - name: ビルド出力の検査
        run: pnpm test:dist
      - name: Cloudflare Pages に配置
        run: pnpm exec wrangler pages deploy dist --project-name=ginowanku-seinenkai --branch="$BRANCH" --commit-hash="$GITHUB_SHA"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
