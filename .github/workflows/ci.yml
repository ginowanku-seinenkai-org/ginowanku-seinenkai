# プルリクエストの検査（05 §2.2）。手順の順番と中身は 03 §2.3 が正
# ジョブ e2e・lighthouse は feature/public-site（00 §6 順9）で足す
name: ci

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 依存の取得
        run: pnpm install --frozen-lockfile
      - name: Lint・書式
        run: pnpm lint
      - name: 型チェック
        run: pnpm typecheck
      - name: 単体テスト
        run: pnpm test
      - name: 固定データでビルド（local）
        run: pnpm build:fixture
      - name: ビルド出力の検査（local）
        run: pnpm test:dist
      - name: 固定データでビルド（preview）
        env:
          PUBLIC_SITE_ENV: preview
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm build:fixture
      - name: ビルド出力の検査（preview）
        env:
          PUBLIC_SITE_ENV: preview
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm test:dist
